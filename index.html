(async () => {
  const fail = () => { document.getElementById("msg").innerHTML = "<strong>Link incompleto.</strong><p>Apri il collegamento completo che ti è stato inviato, compresa la parte dopo il simbolo #.</p>"; };
  try {
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const raw = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    const key = await crypto.subtle.importKey("raw", b64(raw + "=".repeat((4 - raw.length % 4) % 4)), "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data)));
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
    // Parsed scripts are inert: re-create them in order so they run.
    for (const old of Array.from(document.querySelectorAll("script"))) {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  } catch { fail(); }
})();
